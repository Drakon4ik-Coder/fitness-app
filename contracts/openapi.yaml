  /api/v1/nutrition/entries/{id}:
    patch:
      operationId: v1_nutrition_entries_partial_update
      description: |-
        Edit/delete one entry, addressed by server pk or client uuid.

        The uuid route exists for offline replays (KAN-28): an entry created
        offline is edited before the server ever assigned it a pk, so queued ops
        can only reference the client uuid.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMealEntryUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMealEntryUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMealEntryUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealEntry'
          description: ''
        '400':
          description: Invalid payload
        '401':
          description: Unauthorized
        '404':
          description: Entry not found
    delete:
      operationId: v1_nutrition_entries_destroy
      description: |-
        Edit/delete one entry, addressed by server pk or client uuid.

        The uuid route exists for offline replays (KAN-28): an entry created
        offline is edited before the server ever assigned it a pk, so queued ops
        can only reference the client uuid.
      parameters:
      - in: query
        name: client_updated_at
        schema:
          type: string
          format: date-time
        description: LWW mutation time of a replayed offline delete; the delete is
          dropped when the entry changed more recently.
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Entry deleted (or delete superseded)
        '400':
          description: Invalid client_updated_at
        '401':
          description: Unauthorized
        '404':
          description: Entry not found
  /api/v1/nutrition/entries/by-uuid/{client_uuid}:
    patch:
      operationId: v1_nutrition_entries_by_uuid_partial_update
      description: |-
