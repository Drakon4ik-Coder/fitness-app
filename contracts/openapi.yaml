      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
          description: ''
components:
  schemas:
    CustomFood:
      type: object
      description: |-
        A user's own food, written through an owner-scoped upsert.

        `external_id` is a client-generated UUID: re-posting the same id updates
        the caller's food in place, so the mobile sync path is one idempotent
        POST for both create and edit. Custom foods carry no barcode in v1 —
        barcode-shadowing of OFF items is the override story (KAN-31).
      properties:
        external_id:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 255
        brands:
          type: string
          default: ''
          maxLength: 255
        kcal_100g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        protein_g_100g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        carbs_g_100g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        fat_g_100g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        sugars_g_100g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        fiber_g_100g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        salt_g_100g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        serving_size_g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        nutriments_json:
          nullable: true
        overrides_food:
          type: integer
          nullable: true
      required:
      - external_id
      - kcal_100g
      - name
    EmailVerifiedTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    EnergyUnitEnum:
      enum:
      - kcal
      - kj
      type: string
      description: |-
        * `kcal` - kcal
        * `kj` - kj
    FoodItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceAc2Enum'
          default: openfoodfacts
        external_id:
          type: string
          maxLength: 128
        barcode:
          type: string
          nullable: true
          maxLength: 64
        name:
          type: string
          maxLength: 255
        brands:
          type: string
          maxLength: 255
        image_url:
          type: string
          nullable: true
          readOnly: true
        images_ok:
          type: boolean
          readOnly: true
        kcal_100g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        protein_g_100g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        carbs_g_100g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        fat_g_100g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        sugars_g_100g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        fiber_g_100g:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
