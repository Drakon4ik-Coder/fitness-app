# Print Signing SHA Fingerprints
#
# Manual (workflow_dispatch) helper that decodes the release keystore from the
# repo secrets and prints its SHA-1 / SHA-256 fingerprints to the run log.
#
# Use this to get the SHA-1 you must register as an Android OAuth client in the
# Google Cloud Console (required for Google Sign-In on release builds).
#
# How to run: GitHub → Actions → "Print Signing SHA" → Run workflow.
# The fingerprints are NOT secret; it is safe to read them from the log.
# You can delete this workflow once the SHA-1 is registered.

name: Print Signing SHA

on:
  workflow_dispatch:

jobs:
  print-sha:
    runs-on: ubuntu-latest

    steps:
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Print fingerprints
        run: |
          keytool -list -v \
            -keystore release.keystore \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            | grep -E "SHA1:|SHA256:"
