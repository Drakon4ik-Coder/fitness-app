name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"  # weekly (Mon 02:00 UTC) — catches unpinned tooling/base-image drift
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitness
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fitness
      DJANGO_SECRET_KEY: ci-secret
      DJANGO_SETTINGS_MODULE: config.settings.base
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        working-directory: ${{ github.workspace }}
        run: |
          test -f README.md
          test -f LICENSE
          test -f NOTICE
      - uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              # The backend test suite guards the mirrored nutrient catalog,
              # so a Dart-side catalog change must also run the backend job.
              - 'apps/mobile/lib/features/nutrition/data/nutrient_catalog.dart'
              - 'contracts/**'
              - 'scripts/**'
              - 'Makefile'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - '.github/workflows/backend.yml'
      - uses: actions/setup-python@v5
        if: github.event_name != 'pull_request' || steps.changes.outputs.backend == 'true'
        with: { python-version: '3.12' }
      - name: Install Poetry
        if: github.event_name != 'pull_request' || steps.changes.outputs.backend == 'true'
        run: pip install poetry
      - name: Cache Poetry dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.backend == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ hashFiles('apps/backend/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-
      - name: Install deps
        if: github.event_name != 'pull_request' || steps.changes.outputs.backend == 'true'
        run: poetry install --no-interaction --no-root --sync
      - name: Export OpenAPI schema
        if: github.event_name != 'pull_request' || steps.changes.outputs.backend == 'true'
        run: ./scripts/export_openapi.sh
      - name: Check OpenAPI contract is up to date
        if: github.event_name != 'pull_request' || steps.changes.outputs.backend == 'true'
        run: git diff --exit-code ../../contracts/openapi.yaml
      - name: Lint (Ruff)
        if: github.event_name != 'pull_request' || steps.changes.outputs.backend == 'true'
        run: poetry run ruff check --output-format=github .
      - name: Format (Ruff)
        if: github.event_name != 'pull_request' || steps.changes.outputs.backend == 'true'
        run: poetry run ruff format --check .
      - name: Type check (mypy)
        if: github.event_name != 'pull_request' || steps.changes.outputs.backend == 'true'
        run: poetry run mypy .
      - name: Test
        if: github.event_name != 'pull_request' || steps.changes.outputs.backend == 'true'
        run: poetry run pytest --ds=config.settings.test --maxfail=1 --disable-warnings -q

  # The backend deploys to prod on every green main push while mobile
  # releases are dispatch-only, so prod's API must stay backward-compatible
  # with the *last released* app — not just with current main (which the
  # contract-drift step above covers). This diffs the contract against the
  # one at the latest release tag and fails on breaking changes. For a
  # deliberate break (e.g. an endpoint no released build ever called), pass
  # an --err-ignore file per oasdiff's breaking-changes docs.
  contract-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so release tags are reachable
      - name: Extract contract at last release
        id: released
        run: |
          # Run numbers are monotonic across version bumps, so sorting by
          # the +N suffix alone always finds the newest release.
          TAG=$(git tag -l 'v*' | sort -t+ -k2 -n | tail -1)
          if [ -z "$TAG" ]; then
            echo "No release tags yet; skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing against $TAG"
          git show "$TAG:contracts/openapi.yaml" > /tmp/released-openapi.yaml
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Breaking-change check (oasdiff)
        if: steps.released.outputs.found == 'true'
        run: |
          docker run --rm \
            -v /tmp/released-openapi.yaml:/base.yaml:ro \
            -v "$GITHUB_WORKSPACE/contracts/openapi.yaml":/revision.yaml:ro \
            tufin/oasdiff breaking /base.yaml /revision.yaml --fail-on ERR
