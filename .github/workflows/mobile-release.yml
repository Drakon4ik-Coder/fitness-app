# Mobile Release Workflow
#
# Builds a signed Android APK and publishes it as a GitHub Release, plus a
# signed AAB (uploaded as a workflow artifact) for the Play Store. Play only
# accepts App Bundles; with Play App Signing our keystore is the *upload*
# key and Google re-signs on distribution — so the Android OAuth client must
# also include the Play app-signing certificate SHA-1 (Play Console → Test
# and release → App integrity), not just this keystore's SHA-1.
#
# ONE-TIME SETUP (do this before the first push to main):
#   1. Generate a keystore:
#      keytool -genkey -v -keystore release.keystore -alias release \
#        -keyalg RSA -keysize 2048 -validity 10000
#   2. Base64-encode it:
#      base64 -w 0 release.keystore
#   3. Add these 4 secrets in GitHub → Settings → Secrets → Actions:
#      ANDROID_KEYSTORE_BASE64   (output of step 2)
#      ANDROID_KEYSTORE_PASSWORD (storePassword)
#      ANDROID_KEY_PASSWORD      (keyPassword)
#      ANDROID_KEY_ALIAS         (e.g. "release")
#   4. Optional: SENTRY_MOBILE_DSN secret (mobile Sentry project DSN).
#      Unset → the app runs with crash reporting disabled.

name: Mobile Release

on:
  workflow_run:
    workflows: ["Mobile CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../release.keystore
          EOF

      - name: Get version name from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk --release --flavor prod \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_ENV=prod \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_MOBILE_DSN }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=438442823657-527aqhqbf0ivtbtv39hv7t9tucfohg68.apps.googleusercontent.com

      - name: Build release AAB (Play Store)
        run: |
          flutter build appbundle --release --flavor prod \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_ENV=prod \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_MOBILE_DSN }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=438442823657-527aqhqbf0ivtbtv39hv7t9tucfohg68.apps.googleusercontent.com

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-v${{ steps.version.outputs.name }}+${{ github.run_number }}
          path: apps/mobile/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          if-no-files-found: error

      - name: Upload APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}+${{ github.run_number }}
          name: v${{ steps.version.outputs.name }}+${{ github.run_number }}
          generate_release_notes: true
          files: apps/mobile/build/app/outputs/flutter-apk/app-prod-release.apk
