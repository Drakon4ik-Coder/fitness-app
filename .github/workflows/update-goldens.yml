name: Update goldens
# Re-renders the screenshot tests (KAN-129) on Linux, the platform CI compares
# them on, and uploads the PNGs as the `goldens` artifact. Trigger it by
# adding the `update-goldens` label to a PR after an intended UI change, then
# download the artifact into apps/mobile/test/goldens/images/ and commit it.
# Nothing is pushed back automatically, so the commit goes through normal CI.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-goldens'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Flutter Pub Get
        run: flutter pub get
      - name: Render goldens
        run: flutter test --update-goldens test/goldens
      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: apps/mobile/test/goldens/images/
