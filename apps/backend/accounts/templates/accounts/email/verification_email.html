<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f5f5f7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1d1d1f;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;">
    <h1 style="margin:0 0 16px;font-size:22px;">Welcome to Symbio</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#3a3a3c;">
      Please confirm your email address to finish setting up your account.
    </p>
    <a href="{{ verify_url }}"
       style="display:inline-block;background:#0a84ff;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 24px;border-radius:8px;">
      Verify my email
    </a>
    <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#8a8a8e;">
      If the button doesn't work, copy and paste this link into your browser:<br>
      <a href="{{ verify_url }}" style="color:#0a84ff;word-break:break-all;">{{ verify_url }}</a>
    </p>
    <p style="margin:24px 0 0;font-size:13px;color:#8a8a8e;">
      If you didn't create a Symbio account, you can ignore this email.
    </p>
  </div>
</body>
</html>
