<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your Symbio email</title>
</head>
<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1d1d1f;">
  <div style="max-width:420px;margin:24px;padding:32px;background:#ffffff;border-radius:12px;text-align:center;">
    <div aria-hidden="true" style="font-size:48px;line-height:1;">&#128231;</div>
    <h1 style="font-size:22px;margin:16px 0 8px;">Confirm your email</h1>
    <p style="font-size:15px;line-height:1.5;color:#3a3a3c;margin:0 0 24px;">
      Tap the button below to verify this email address and finish setting up
      your Symbio account.
    </p>
    <form method="post" style="margin:0;">
      {% csrf_token %}
      <button type="submit"
              style="display:inline-block;border:0;cursor:pointer;background:#0a84ff;color:#ffffff;font-size:15px;font-weight:600;padding:12px 28px;border-radius:8px;">
        Verify my email
      </button>
    </form>
  </div>
</body>
</html>
