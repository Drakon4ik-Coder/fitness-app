{% extends "accounts/base.html" %}

{% block title %}Confirm your Symbio email{% endblock %}

{% block main %}
  <div class="chip chip--brand" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2"></rect>
      <path d="m3 7 9 6 9-6"></path>
    </svg>
  </div>

  <h1 class="center">Confirm your email</h1>
  <p class="lead center">Tap the button below to verify this email address and finish setting up your Symbio account.</p>

  <form method="post" style="margin-top:28px;">
    {% csrf_token %}
    <button type="submit" class="btn">Verify my email</button>
  </form>
{% endblock %}
