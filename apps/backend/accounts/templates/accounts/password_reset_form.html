<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your Symbio password</title>
</head>
<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1d1d1f;">
  <div style="max-width:420px;margin:24px;padding:32px;background:#ffffff;border-radius:12px;">
    <div aria-hidden="true" style="font-size:48px;line-height:1;text-align:center;">&#128274;</div>
    <h1 style="font-size:22px;margin:16px 0 8px;text-align:center;">Choose a new password</h1>
    <p style="font-size:15px;line-height:1.5;color:#3a3a3c;margin:0 0 24px;text-align:center;">
      Enter a new password for your Symbio account.
    </p>
    {% if errors %}
      <div role="alert" style="background:#fde8e8;border-radius:8px;padding:12px 16px;margin:0 0 20px;font-size:14px;line-height:1.5;color:#9b1c1c;">
        <ul style="margin:0;padding-left:18px;">
          {% for error in errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
      </div>
    {% endif %}
    <form method="post" style="margin:0;">
      {% csrf_token %}
      <label for="password" style="display:block;font-size:13px;font-weight:600;color:#3a3a3c;margin:0 0 6px;">New password</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"
             style="width:100%;box-sizing:border-box;padding:12px 14px;font-size:15px;border:1px solid #d2d2d7;border-radius:8px;margin:0 0 12px;">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#3a3a3c;margin:0 0 24px;cursor:pointer;">
        <input type="checkbox" onclick="document.getElementById('password').type = this.checked ? 'text' : 'password';">
        Show password
      </label>
      <button type="submit"
              style="width:100%;border:0;cursor:pointer;background:#0a84ff;color:#ffffff;font-size:15px;font-weight:600;padding:12px 28px;border-radius:8px;">
        Reset password
      </button>
    </form>
  </div>
</body>
</html>
