# Static analysis for the mobile app: the standard flutter_lints set plus a
# few stricter rules this codebase already follows (see docs/CODE_HEALTH.md
# P8). Suppress one-offs with `// ignore: name_of_lint` rather than turning a
# rule off globally.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Fire-and-forget futures hide dropped errors; deliberate ones must opt
    # in explicitly via `unawaited(...)` so the intent is visible.
    unawaited_futures: true
    # All JSON parsing is hand-written (CLAUDE.md rule 4); dynamic member
    # access defeats the explicit `is`/`as` checks that make that safe.
    avoid_dynamic_calls: true
    directives_ordering: true
    prefer_final_locals: true
