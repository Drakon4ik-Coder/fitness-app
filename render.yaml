services:
  - type: web
    name: fitness-backend
    runtime: docker
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: apps/backend
    branch: develop
    plan: free
    region: frankfurt
    healthCheckPath: /health/

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY         # match your settings file
        generateValue: true
      - key: SENTRY_DSN
        sync: false                    # backend project DSN (shared with prod)
      - key: SENTRY_ENVIRONMENT       # this Render service tracks develop
        value: staging
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
