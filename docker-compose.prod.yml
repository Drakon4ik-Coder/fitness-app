services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-symbio}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nightly pg_dump shipped off-host (KAN-46). Backup destination and
  # healthcheck ping come from .env (BACKUP_* / RCLONE_CONFIG_* vars) —
  # see docs/OPERATIONS.md for setup and the restore drill.
  db-backup:
    build: ./ops/db-backup
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-symbio}
    depends_on:
      db:
        condition: service_healthy

  # Shared cache for every gunicorn worker (KAN-119): DRF throttles, the
  # meal-times cache bust and the FatSecret token. Pure cache: no persistence
  # (losing it on restart only resets rate-limit windows) and a hard memory
  # cap with LRU eviction so it can never grow unbounded.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-symbio}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static-data:/app/staticfiles
      - media-data:/app/media

volumes:
  db-data:
  static-data:
  media-data:
